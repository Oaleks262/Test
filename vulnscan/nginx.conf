# Nginx конфігурація для VULNSCAN
# Розмістіть файл: /etc/nginx/sites-available/vulnscan
# Активуйте: ln -s /etc/nginx/sites-available/vulnscan /etc/nginx/sites-enabled/
# Перезапустіть: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;  # Замініть на ваш домен або IP

    # Перенаправлення HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # Замініть на ваш домен або IP

    # SSL сертифікати (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL налаштування безпеки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Заголовки безпеки
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Приховуємо версію nginx
    server_tokens off;

    # Статичні файли
    location /public/ {
        alias /var/www/vulnscan/public/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Проксі на Node.js сервер
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Логи
    access_log /var/log/nginx/vulnscan-access.log;
    error_log  /var/log/nginx/vulnscan-error.log;
}
